name: Auto-refresh fork build (unsigned IPA)

on:
  push:
    branches: [auto-refresh, 'feat-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          NORMALIZED=$(python3 scripts/ci/workflow.py compute-normalized "$MARKETING_VERSION" "${{ github.run_number }}" "$SHORT_COMMIT")
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED"
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED" | tee -a $GITHUB_ENV
          echo "BRANCH_SAFE=$(echo '${{ github.ref_name }}' | tr '/' '-')" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Build
        run: python3 scripts/ci/workflow.py build

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.BRANCH_SAFE }}-${{ env.SHORT_COMMIT }}-ipa
          path: SideStore.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ env.BRANCH_SAFE }}-${{ env.SHORT_COMMIT }}
          path: build/logs
          retention-days: 14
